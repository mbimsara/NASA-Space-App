[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agrosphere-rotation"
version = "0.1.0"
description = "Transparent crop-rotation and water-budget engine for AgroSphere AI"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agrosphere_rotation"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
