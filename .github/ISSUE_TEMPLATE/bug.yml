name: Bug report
description: Report a reproducible failure or incorrect result
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and environment
      description: Include input version and fixture/analysis IDs where useful. Exclude secrets and private records.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant units, screenshots, or a minimal safe example.
    validations:
      required: true
