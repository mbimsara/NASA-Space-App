name: Hosted staging compatibility (no deployment)
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'deploy/render-vercel/**', 'render.yaml', 'data/**', 'src/**', '.github/workflows/hosted-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compatibility
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U test -d compatibility" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      DATABASE_URL: "sqlite:///:memory:"
      NASA_POWER_ENABLED: "false"
      TEST_POSTGRES_URL: postgresql+psycopg://test:isolated-ci-only@127.0.0.1:5432/compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install . -r backend/requirements-ci.txt -r backend/requirements-postgres.txt
      - run: python -m pytest backend/tests/test_postgres_compatibility.py backend/tests/test_hosted_deployment.py --allow-hosts=127.0.0.1,::1 -ra
      - run: node --test deploy/render-vercel/proxy.test.mjs
