name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/backend-tests.yml'
      - '.env.example'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'conftest.py'
  pull_request:
    paths:
      - 'backend/**'
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/backend-tests.yml'
      - '.env.example'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'conftest.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Validate shared data
        run: python scripts/validate_data.py
      - name: Install backend and CI dependencies
        working-directory: backend
        run: python -m pip install -e .. -r requirements-ci.txt
      - name: Run all backend tests without network access
        shell: bash
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/agrosphere-ci.db
        run: |
          # Startup currently uses a relative SQLite path. Keep it outside the checkout.
          test_dir="$(mktemp -d "$RUNNER_TEMP/backend-tests.XXXXXX")"
          trap 'rm -rf "$test_dir"' EXIT
          cd "$test_dir"
          python -m pytest "$GITHUB_WORKSPACE/backend/tests" -ra \
            --disable-socket --allow-unix-socket \
            --junitxml="$RUNNER_TEMP/backend-tests.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-tests.xml
          if-no-files-found: ignore
