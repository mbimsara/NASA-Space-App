name: Shared data checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install rotation package and test dependencies
        run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_data.py
      - name: Run shared climate, SMAP, and rotation tests
        run: python -m pytest tests -v
  smap-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install rotation, test, and optional SMAP dependencies
        run: python -m pip install -e ".[dev]" -r backend/requirements-smap.txt
      - name: Run shared tests with optional SMAP file support
        run: python -m pytest tests -v
