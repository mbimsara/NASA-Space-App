name: Frontend tests

# Core frontend regression checks (IMPLEMENTATION_PLAN: Demo and quality — Shehani).
# Runs the locked install, type-check, lint, unit tests and production build.
on:
  push:
    paths:
      - 'frontend/**'
      - 'data/catalogs/**'
      - 'data/fixtures/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'data/catalogs/**'
      - 'data/fixtures/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
