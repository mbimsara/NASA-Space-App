name: agrosphere-staging
services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/staging/backend.Dockerfile
    environment:
      APP_ENV: staging
      DATABASE_URL: sqlite:////var/lib/agrosphere/agrosphere.db
      CORS_ORIGINS: ${STAGING_ORIGIN:?Set the exact HTTPS staging origin}
      NASA_POWER_ENABLED: "true"
      OBSERVATION_CACHE_TTL_SECONDS: "86400"
      ASSISTANT_PROVIDER: deterministic
    volumes:
      - database:/var/lib/agrosphere
    # No published API port. Never expose this service directly.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  gateway:
    build:
      context: ../..
      dockerfile: deploy/staging/gateway.Dockerfile
      args:
        STAGING_ORIGIN: ${STAGING_ORIGIN:?Set the exact HTTPS staging origin}
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set the staging DNS name}
      STAGING_USER: ${STAGING_USER:?Set the staging username}
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH:?Set a Caddy password hash}
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: [CMD-SHELL, "test -s /data/caddy/pki/authorities/local/root.crt"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  database:
  caddy_data:
  caddy_config:
